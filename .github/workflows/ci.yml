# Runs the same checks as the README / CLAUDE.md hand-off list on every push
# to main and on every pull request. Tests mock the API with msw, so no
# backend or secrets are needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint (type-aware ESLint + jsx-a11y)
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Type check and build
        run: npm run build
